name: transcendence-backend-tests

services:
  bot-test:
    build:
      context: ../../..
      dockerfile: bot/Dockerfile
    ports:
      - '127.0.0.1:${TEST_BOT_ENGINE_PORT:-55434}:8082'

  # Real rules engine for Games integration tests; separate from the app stack.
  chess-engine-test:
    build:
      context: ../../../chess-engine
    ports:
      - '127.0.0.1:${TEST_CHESS_ENGINE_PORT:-55433}:8081'

  postgres-test:
    image: docker.io/library/postgres:15
    environment:
      POSTGRES_DB: transcendence_test
      POSTGRES_USER: foundation_test
      POSTGRES_PASSWORD: foundation_test_only
    ports:
      - '127.0.0.1:${TEST_DATABASE_PORT:-55432}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foundation_test -d transcendence_test']
      interval: 2s
      timeout: 3s
      retries: 15

  # Runs every test suite inside Node 22, independently of the host setup.
  # Only started on demand: `make test` (repo root) or `npm run test:docker`.
  tests:
    profiles: ['tests']
    build:
      context: ../..
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_HOST: postgres-test
      TEST_DATABASE_PORT: '5432'
      TEST_BOT_ENGINE_URL: 'ws://bot-test:8082'
      TEST_CHESS_ENGINE_URL: 'ws://chess-engine-test:8081'
    depends_on:
      postgres-test:
        condition: service_healthy
      bot-test:
        condition: service_started
      chess-engine-test:
        condition: service_started
