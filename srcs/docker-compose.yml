services:
    bot:
      build:
        context: .
        dockerfile: bot/Dockerfile
      init: true
      restart: unless-stopped
      expose:
        - "8082"
      networks:
        - transcendence


    chess-engine:
      build:
        context: ./chess-engine
        dockerfile: Dockerfile
      init: true
      restart: unless-stopped
      expose:
        - "8081"
      networks:
        - transcendence

    nginx:
      container_name: nginx
      build:
        context: angular
        dockerfile: Dockerfile
      networks:
        - transcendence
      ports:
        - "${HTTPPORT}:80"
        - "${APPPORT}:443"
      restart: on-failure
      depends_on:
        nestjs:
          condition: service_healthy
      environment:
        APPPORT: ${APPPORT}
        APIPORT: ${APIPORT}

    postgres:
      container_name: postgres
      build:
        context: ./postgreSQL
        dockerfile: Dockerfile
      environment:
        POSTGRES_DB: ${DATABASE_NAME}
        POSTGRES_USER: ${DATABASE_USER}
        POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
        POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER}
        POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD}
      volumes:
        - postgres_data:/var/lib/postgresql/data
      # No published port: only the services of the transcendence network
      # reach the database (the subject requires HTTPS for any outside access).
      networks:
        - transcendence
      restart: unless-stopped
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
        interval: 5s
        timeout: 5s
        retries: 5

    # No published port: Grafana queries Prometheus inside the network.
    prometheus:
      container_name: prometheus
      build:
        context: ./prometheus
      environment:
        APIPORT: ${APIPORT}
      volumes:
        - prometheus_data:/prometheus
      networks:
        - transcendence
      restart: unless-stopped

    # Turns firing alert rules into emails (through forgemail). Silences are
    # managed from Grafana; no published port.
    alertmanager:
      container_name: alertmanager
      build:
        context: ./alertmanager
      environment:
        ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN}
      volumes:
        - alertmanager_data:/alertmanager
      networks:
        - transcendence
      restart: unless-stopped

    # Exporters: metrics of the machine, of each container and of PostgreSQL,
    # scraped by Prometheus. Read-only mounts, no published port.
    node-exporter:
      container_name: node-exporter
      image: docker.io/prom/node-exporter:v1.12.1
      command:
        - --path.rootfs=/host
        # Also skips the files Docker mounts into the exporter itself.
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|etc|run/credentials/.+|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
      volumes:
        - /:/host:ro
      networks:
        - transcendence
      restart: unless-stopped

    cadvisor:
      container_name: cadvisor
      # Newer releases are published on ghcr.io/google/cadvisor.
      image: gcr.io/cadvisor/cadvisor:v0.55.1
      command:
        - --docker_only=true
        - --housekeeping_interval=15s
        - --enable_metrics=cpu,memory,network
        - --store_container_labels=false
        - --whitelisted_container_labels=com.docker.compose.service
      volumes:
        - /:/rootfs:ro
        - /var/run:/var/run:ro
        - /sys:/sys:ro
      networks:
        - transcendence
      restart: unless-stopped

    postgres-exporter:
      container_name: postgres-exporter
      image: docker.io/prometheuscommunity/postgres-exporter:v0.20.1
      command:
        # Start time of the server, for the uptime panel.
        - --collector.postmaster
      environment:
        # The read-only role of the backups, also granted pg_monitor.
        DATA_SOURCE_URI: postgres:5432/${DATABASE_NAME}?sslmode=disable
        DATA_SOURCE_USER: ${POSTGRES_BACKUP_USER}
        DATA_SOURCE_PASS: ${POSTGRES_BACKUP_PASSWORD}
      networks:
        - transcendence
      restart: unless-stopped
      depends_on:
        postgres:
          condition: service_healthy

    nestjs:
      container_name: nestjs
      build:
        context: ./nestJS
        dockerfile: Dockerfile
      environment:
        BOT_ENGINE_URL: ws://bot:8082
        CHESS_ENGINE_URL: ws://chess-engine:8081
        MAIL_SERVICE_URL: http://forgemail:3002
        APIPORT: ${APIPORT}
        CORS_ORIGINS: ${CORS_ORIGINS:-}
        DATABASE_HOST: ${DATABASE_HOST}
        DATABASE_PORT: ${DATABASE_PORT}
        DATABASE_NAME: ${DATABASE_NAME}
        DATABASE_USER: ${DATABASE_USER}
        DATABASE_PASSWORD: ${DATABASE_PASSWORD}
        JWT_SECRET: ${JWT_SECRET}
        RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
        JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
        REFRESH_EXPIRES_IN: ${REFRESH_EXPIRES_IN:-604800}
        APPURL: ${APPURL:-}
        OAUTH_PUBLIC_URL: ${OAUTH_PUBLIC_URL:-}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
        GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
        GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
        GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
        GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
        FORTYTWO_CLIENT_ID: ${FORTYTWO_CLIENT_ID:-}
        FORTYTWO_CLIENT_SECRET: ${FORTYTWO_CLIENT_SECRET:-}
        FORTYTWO_CALLBACK_URL: ${FORTYTWO_CALLBACK_URL:-}
        AVATAR_DIR: /app/uploads/avatars
      # Uploaded avatars outlive the container. The time of the last backup
      # (written by the backup service) feeds the status page and the alerts.
      volumes:
        - avatars:/app/uploads
        - ${BACKUP_DIR:-../backups}/status:/backups/status:ro
      networks:
        - transcendence
      restart: on-failure
      depends_on:
        postgres:
          condition: service_healthy
        forgemail:
          condition: service_healthy
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS \"http://localhost:$${APIPORT}/v1/health\" > /dev/null"]
        interval: 5s
        timeout: 5s
        retries: 5

    # Sends emails for the API. No published port: only reachable from the
    # transcendence network. Without SMTP credentials it logs mails instead.
    forgemail:
      expose:
        - "3002"
      container_name: forgemail
      build:
        context: ./forgemail
      environment:
        SMTP_HOST: ${SMTP_HOST}
        SMTP_PORT: ${SMTP_PORT}
        SMTP_USER: ${SMTP_USER}
        SMTP_PASSWORD: ${SMTP_PASSWORD}
        MAIL_FROM: ${MAIL_FROM}
        APPURL: ${APPURL}
        # Monitoring alerts from Alertmanager.
        ALERT_EMAIL: ${ALERT_EMAIL:-}
        ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN}
      networks:
        - transcendence
      restart: on-failure
      healthcheck:
        test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
        interval: 5s
        timeout: 5s
        retries: 5

    grafana:
      build:
        context: ./grafana
        dockerfile: Dockerfile
      container_name: grafana
      restart: unless-stopped
      environment:
        GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
        GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
        GF_SERVER_ROOT_URL: ${APPURL}/grafana/
        GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      expose:
        - "3000"
      volumes:
        - grafana_data:/var/lib/grafana
      networks:
        - transcendence

volumes:
  postgres_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  avatars:

networks:
  transcendence:
    name: transcendence
