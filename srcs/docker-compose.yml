services:

    chess-engine:
      build:
        context: ./chess-engine
        dockerfile: Dockerfile
      init: true
      restart: unless-stopped
      expose:
        - "8081"
      networks:
        - transcendence

    nginx:
      container_name: nginx
      build:
        context: angular
        dockerfile: Dockerfile
      networks:
        - transcendence
      ports:
        - "${HTTPPORT}:80"
        - "${APPPORT}:443"
      restart: on-failure
      depends_on:
        nestjs:
          condition: service_healthy
      environment:
        APPPORT: ${APPPORT}

    postgres:
      container_name: postgres
      build:
        context: ./postgreSQL
        dockerfile: Dockerfile
      environment:
        POSTGRES_DB: ${DATABASE_NAME}
        POSTGRES_USER: ${DATABASE_USER}
        POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
        POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER}
        POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD}
      volumes:
        - postgres_data:/var/lib/postgresql/data
      ports:
        - "${DATABASE_PORT}:5432"
      networks:
        - transcendence
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U transcendence -d transcendence"]
        interval: 5s
        timeout: 5s
        retries: 5

    prometheus:
      container_name: prometheus
      build:
        context: ./prometheus
      ports:
      - "9090:9090"
      volumes:
        - prometheus_data:/prometheus
      networks:
        - transcendence

    nestjs:
      container_name: nestjs
      build:
        context: ./nestJS
        dockerfile: Dockerfile
      environment:
        CHESS_ENGINE_URL: ws://chess-engine:8081
        MAIL_SERVICE_URL: http://forgemail:3002
        APIPORT: ${APIPORT}
        DATABASE_HOST: ${DATABASE_HOST}
        DATABASE_PORT: ${DATABASE_PORT}
        DATABASE_NAME: ${DATABASE_NAME}
        DATABASE_USER: ${DATABASE_USER}
        DATABASE_PASSWORD: ${DATABASE_PASSWORD}
        JWT_SECRET: ${JWT_SECRET}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
        GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
        GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
        GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
        GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      networks:
        - transcendence
      restart: on-failure
      depends_on:
        postgres:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:3000/v1/health"]
        interval: 5s
        timeout: 5s
        retries: 5

    # Sends emails for the API. No published port: only reachable from the
    # transcendence network. Without SMTP credentials it logs mails instead.
    forgemail:
      container_name: forgemail
      build:
        context: ./forgemail
      environment:
        PUBLIC_URL: ${PUBLIC_URL}
        SMTP_HOST: ${SMTP_HOST}
        SMTP_PORT: ${SMTP_PORT}
        SMTP_USER: ${SMTP_USER}
        SMTP_PASSWORD: ${SMTP_PASSWORD}
        MAIL_FROM: ${MAIL_FROM}
      networks:
        - transcendence
      restart: on-failure
      healthcheck:
        test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
        interval: 5s
        timeout: 5s
        retries: 5

    grafana:
      build:
        context: ./grafana
        dockerfile: Dockerfile
      container_name: grafana
      restart: unless-stopped
      environment:
        GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
        GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
        GF_SERVER_ROOT_URL: https://localhost:${APPPORT}/grafana/
        GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      expose:
        - "3000"
      volumes:
        - grafana_data:/var/lib/grafana
      networks:
        - transcendence

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  transcendence:
    name: transcendence