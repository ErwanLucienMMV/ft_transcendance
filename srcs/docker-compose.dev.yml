services:
  angular:
    container_name: angular
    build:
      context: ./angular
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - ./angular/42chess:/app
      - angular_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - transcendence
    stdin_open: true
    tty: true
  nestjs:
    container_name: nestjs
    build:
      context: ./nestJS
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./nestJS/42chess:/app
      - nestjs_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - transcendence
  prometheus:
    container_name: prometheus
    build:
      context: ./prometheus
    ports:
    - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - transcendence
  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - transcendence
  postgres:
    container_name: postgres
    build:
      context: ./postgreSQL
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - transcendence

volumes:
  angular_node_modules:
  nestjs_node_modules:
  prometheus_data:
  grafana_data:
  postgres_data:

networks:

  transcendence:
    driver: bridge
