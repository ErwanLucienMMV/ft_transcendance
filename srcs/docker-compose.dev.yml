services:
  angular:
    container_name: angular
    build:
      context: ./angular
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - ./angular/42chess:/app
      - angular_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
  nestjs:
    container_name: nestjs
    build:
      context: ./nestJS
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./nestJS/42chess:/app
      - nestjs_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  angular_node_modules:
  nestjs_node_modules:
