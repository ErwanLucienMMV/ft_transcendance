services:
  angular:
    container_name: angular
    build:
      context: ./angular
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - ./angular/42chess:/app
      - angular_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - transcendence
    stdin_open: true
    tty: true
  nestjs:
    container_name: nestjs
    build:
      context: ./nestJS
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./nestJS/42chess:/app
      - nestjs_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - transcendence
  prometheus:
    container_name: prometheus
    build:
      context: ./prometheus
    ports:
    - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - transcendence

volumes:
  angular_node_modules:
  nestjs_node_modules:
  prometheus_data:

networks:

  transcendence:
    driver: bridge
