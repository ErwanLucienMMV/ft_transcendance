services:
  chess-engine:
    build:
      context: ./chess-engine
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    expose:
      - "8081"
    networks:
      - transcendence

  angular:
    container_name: angular
    build:
      context: ./angular
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - ./angular/42chess:/app
      - angular_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - transcendence
    stdin_open: true
    tty: true
  nestjs:
    container_name: nestjs
    build:
      context: ./nestJS
      dockerfile: Dockerfile.dev
    ports:
      - "${APIPORT:-3000}:${APIPORT:-3000}"
    volumes:
      - ./nestJS/42chess:/app
      - nestjs_node_modules:/app/node_modules
    environment:
      - APIPORT=${APIPORT:-3000}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - CHESS_ENGINE_URL=ws://chess-engine:8081
      - MAIL_SERVICE_URL=http://forgemail:3002
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence
  forgemail:
    container_name: forgemail
    build:
      context: ./forgemail
    environment:
      - PUBLIC_URL=${PUBLIC_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
    networks:
      - transcendence
  prometheus:
    container_name: prometheus
    build:
      context: ./prometheus
    ports:
    - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - transcendence
  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - transcendence
  postgres:
    container_name: postgres
    build:
      context: ./postgreSQL
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - transcendence

volumes:
  angular_node_modules:
  nestjs_node_modules:
  prometheus_data:
  grafana_data:
  postgres_data:

networks:

  transcendence:
    driver: bridge
