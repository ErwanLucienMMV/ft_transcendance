<a class="skip-link" href="#main-content">Skip to main content</a>
<header>
  <h1>Hello, {{ title() }}</h1>
  <nav aria-label="Main navigation">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      >Home</a
    >
    @if (session.authenticated()) {
      <a routerLink="/session" routerLinkActive="active" ariaCurrentWhenActive="page">{{
        session.user()?.username
      }}</a>
      <button type="button" (click)="signOut()">
        {{ lifecycle.capabilities.logout ? 'Sign out' : 'Sign out of this tab' }}
      </button>
    } @else {
      <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Sign in</a>
      <a routerLink="/register" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Create an account</a
      >
    }
  </nav>
</header>
<main id="main-content" tabindex="-1">
  @if (errors.message(); as message) {
    <section class="global-error" role="alert" aria-label="Application error">
      <p>{{ message }}</p>
      <button type="button" (click)="errors.dismiss()">Dismiss</button>
    </section>
  }
  <router-outlet />
</main>
