<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/" aria-label="42 Chess home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><use href="/chess-pieces.svg#knight" /></svg>
      <span>42 CHESS</span>
    </a>
    <h1 class="sr-only">Hello, {{ title() }}</h1>
    <nav aria-label="Main navigation">
      <a routerLink="/play" routerLinkActive="active" ariaCurrentWhenActive="page">Play</a>
      <a routerLink="/puzzle" routerLinkActive="active" ariaCurrentWhenActive="page">Puzzle</a>
      <a routerLink="/board" routerLinkActive="active" ariaCurrentWhenActive="page">Board</a>
      @if (session.user(); as user) {
        <a routerLink="/history" routerLinkActive="active" ariaCurrentWhenActive="page">History</a>
        <a routerLink="/session" routerLinkActive="active" ariaCurrentWhenActive="page">{{
          user.username
        }}</a>
        <button class="nav-signout" type="button" (click)="signOut()">Sign out</button>
      } @else {
        <a
          class="nav-login"
          routerLink="/login"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          >Sign in</a
        >
        <a
          class="nav-register"
          routerLink="/register"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          >Create an account</a
        >
      }
    </nav>
  </div>
</header>
<main id="main-content" tabindex="-1">
  @if (errors.message(); as message) {
    <section class="global-error" role="alert" aria-label="Application error">
      <p>{{ message }}</p>
      <button type="button" (click)="errors.dismiss()">Dismiss</button>
    </section>
  }
  <router-outlet />
</main>
<footer class="site-footer">
  <span>42 CHESS · BUILT TO PLAY</span><span>Every move is a new beginning.</span>
</footer>
