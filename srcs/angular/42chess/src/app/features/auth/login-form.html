<ng-container *transloco="let t">
  <form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="pending()" novalidate>
    <div class="form-field">
      <label for="login">{{ t('auth.login.loginLabel') }}</label>
      <input
        id="login"
        type="text"
        formControlName="login"
        autocomplete="username"
        [placeholder]="t('auth.login.loginPlaceholder')"
        required
        [maxLength]="limits.emailMax"
        [attr.aria-invalid]="invalid('login')"
        [attr.aria-describedby]="invalid('login') ? 'login-error' : null"
      />
      @if (invalid('login')) {
        <p id="login-error">{{ t('auth.login.loginError', { max: limits.emailMax }) }}</p>
      }
    </div>
    <div class="form-field">
      <label for="login-password">{{ t('auth.login.password') }}</label>
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [placeholder]="t('auth.login.passwordPlaceholder')"
        required
        [attr.aria-invalid]="invalid('password')"
        [attr.aria-describedby]="invalid('password') ? 'login-password-error' : null"
      />
      @if (invalid('password')) {
        <p id="login-password-error">
          {{ t('auth.login.passwordError', { max: limits.passwordMax }) }}
        </p>
      }
    </div>
    @if (!submissionEnabled()) {
      <p role="status">{{ t('auth.login.unavailable') }}</p>
    }
    <button type="submit" [disabled]="!submissionEnabled() || pending()">
      {{ pending() ? t('auth.login.submitting') : t('auth.login.submit') }}
    </button>
  </form>
</ng-container>
