<ng-container *transloco="let t">
  <app-auth-frame>
    <h1>{{ t('auth.twoFactor.title') }}</h1>
    <p class="auth-intro">{{ t('auth.twoFactor.intro') }}</p>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate [attr.aria-busy]="pending()">
      <label for="totp-code">{{ t('auth.twoFactor.label') }}</label>
      <input
        id="totp-code"
        formControlName="code"
        autocomplete="one-time-code"
        maxlength="11"
        spellcheck="false"
        required
      />
      @if (form.invalid && form.touched) {
        <p role="alert">{{ t('auth.twoFactor.error') }}</p>
      }
      <button type="submit" [disabled]="pending()">{{ t('auth.twoFactor.submit') }}</button>
    </form>
    @if (error()) {
      <p role="alert">{{ error() }}</p>
    }
    <p class="auth-switch">
      <a routerLink="/login" (click)="auth.cancelChallenge()">{{ t('auth.twoFactor.restart') }}</a>
    </p>
  </app-auth-frame>
</ng-container>
