<ng-container *transloco="let t">
  <details>
    <summary>{{ t('auth.resend.summary') }}</summary>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate [attr.aria-busy]="pending()">
      <label for="resend-email">{{ t('auth.resend.label') }}</label>
      <input
        id="resend-email"
        type="email"
        autocomplete="email"
        formControlName="email"
        required
        maxlength="254"
      />
      @if (form.invalid && form.touched) {
        <p role="alert">{{ t('auth.resend.error') }}</p>
      }
      <button type="submit" [disabled]="pending()">{{ t('auth.resend.submit') }}</button>
    </form>
    @if (message()) {
      <p role="status">{{ message() }}</p>
    }
  </details>
</ng-container>
