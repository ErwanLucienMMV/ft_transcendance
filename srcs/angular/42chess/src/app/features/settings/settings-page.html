<ng-container *transloco="let t">
  <section class="settings-page page narrow" aria-labelledby="settings-title">
    <header class="page-head">
      <div>
        <span class="eyebrow">{{ t('settings.eyebrow') }}</span>
        <h1 id="settings-title">{{ t('settings.title') }}</h1>
        <p>{{ t('settings.intro') }}</p>
      </div>
      @if (session.user(); as user) {
        <a class="button secondary" [routerLink]="['/players', user.id]">{{
          t('settings.viewProfile')
        }}</a>
      }
    </header>

    @if (welcome()) {
      <p class="welcome" role="status">{{ t('settings.welcome') }}</p>
    }

    <app-profile-settings />
    <app-appearance-settings />
    <app-privacy-settings />
    <app-security-settings
      [status]="security()"
      [failed]="securityFailed()"
      (changed)="loadSecurity()"
    />
    <app-oauth-accounts />
    <app-data-settings [status]="security()" (deleted)="leave()" />
  </section>
</ng-container>
