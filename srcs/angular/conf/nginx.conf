#I love pastabox

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Use the TCP peer, never client-controlled X-Forwarded-For. Shared zones
    # keep the budget consistent across all Nginx workers.
    limit_req_zone $binary_remote_addr zone=api_requests:10m rate=10r/s;
    map $uri $auth_limit_key {
        default "";
        ~*^/api/v1/auth/(login|register|2fa/verify|resend-verification|verify-email|oauth/(google|github)(/callback|/link)?|oauth/exchange)/?$ $binary_remote_addr;
    }
    limit_req_zone $auth_limit_key zone=auth_requests:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/inception.crt;
    	ssl_certificate_key /etc/nginx/ssl/inception.key;

    	root /usr/share/nginx/html;
    	index index.html;

        location / {
            try_files $uri $uri/index.html /index.csr.html;
        }

        location = /ws {
            proxy_pass http://nestjs:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 75s;
        }

		location /api/ {
        limit_req zone=api_requests burst=40 nodelay;
        limit_req zone=auth_requests burst=10 nodelay;
        error_page 429 = @rate_limited;
        proxy_pass http://nestjs:3000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    	}

        location @rate_limited {
            default_type application/json;
            add_header Retry-After 6 always;
            add_header Cache-Control no-store always;
            return 429 '{"statusCode":429,"code":"TOO_MANY_REQUESTS","message":"Too many requests. Try again later."}';
        }

		location /grafana/ {
    		proxy_pass http://grafana:3000;

	    	proxy_http_version 1.1;

    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto $scheme;
		}
    }
	server {
    	listen 80;
    	server_name _;

    	return 301 https://$host:${APPPORT}$request_uri;
	}
}
