user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    # API answers are not compressed: they carry tokens next to values a client
    # chooses, which compression would let an observer guess (BREACH).
    gzip_types text/css application/javascript image/svg+xml;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Rate limits, keyed on the TCP peer: a client cannot reset them with
    # X-Forwarded-For or X-Real-IP. Shared zones keep one budget across the
    # workers. The API keeps its own, finer limits behind these.
    limit_req_zone $binary_remote_addr zone=api_requests:10m rate=10r/s;
    # Uploaded pictures are immutable and cached, but one list page can ask
    # for dozens at once: they get their own budget.
    limit_req_zone $binary_remote_addr zone=avatar_requests:10m rate=50r/s;
    # Signing in or up, codes and email links share one strict budget; refresh,
    # logout and the rest of the API do not use it. Case and query variants of
    # a path count against the same budget.
    map $uri $auth_limit_key {
        default "";
        ~*^/api/v1/auth/(login|register|2fa/verify|resend-verification|verify-email|forgot-password|reset-password|oauth/(google|github|fortytwo)(/callback|/link)?|oauth/exchange)/?$ $binary_remote_addr;
    }
    limit_req_zone $auth_limit_key zone=auth_requests:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/transcendence.crt;
        ssl_certificate_key /etc/nginx/ssl/transcendence.key;

        # Avatars are the largest uploads (2 MB checked by the API).
        client_max_body_size 3m;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            include /etc/nginx/security-headers.conf;
            # Component styles are injected at runtime, hence 'unsafe-inline'
            # for styles only. Scripts must come from this origin.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            try_files $uri $uri/index.html /index.csr.html;
        }

        location = /ws {
            proxy_pass http://nestjs:${APIPORT};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 75s;
        }

        # Same error format as the API, so the front explains a rate limit.
        # The strict budget frees a request every 6 seconds.
        error_page 429 = @too_many_requests;
        location @too_many_requests {
            include /etc/nginx/security-headers.conf;
            add_header Retry-After 6 always;
            add_header Cache-Control no-store always;
            default_type application/json;
            return 429 '{"statusCode":429,"code":"TOO_MANY_REQUESTS","message":"Too many requests. Wait a moment, then try again."}';
        }

        # Prometheus scrapes the API inside the network: the metrics are not public.
        location ~* ^/grafana/+metrics/?$ {
            return 404;
        }

        location ~* ^/api/+(v1/+)?metrics/?$ {
            return 404;
        }

        location /api/v1/avatars/ {
            include /etc/nginx/security-headers.conf;
            limit_req zone=avatar_requests burst=100 nodelay;
            proxy_pass http://nestjs:${APIPORT}/v1/avatars/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            include /etc/nginx/security-headers.conf;
            limit_req zone=api_requests burst=40 nodelay;
            limit_req zone=auth_requests burst=10 nodelay;
            proxy_pass http://nestjs:${APIPORT}/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana sets its own policy: it needs inline scripts.
        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        server_name _;

        return 301 https://$host:${APPPORT}$request_uri;
    }
}
