services:
  backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transcendence-backup
    # Compose interpolates ${...} from backup/.env, which does not exist, so
    # credentials are read from srcs/.env at runtime by tools/entrypoint.sh.
    env_file:
      - ../srcs/.env
    environment:
      PGHOST: postgres
      PGPORT: 5432
    volumes:
      - backup_data:/backups
    networks:
      - transcendence
    restart: unless-stopped

volumes:
  backup_data:
    name: transcendence_backup_data

networks:
  transcendence:
    external: true
