services:
  backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transcendence-backup
    # Compose interpolates ${...} from backup/.env, which does not exist, so
    # credentials are read from srcs/.env at runtime by tools/entrypoint.sh.
    env_file:
      - ../srcs/.env
    environment:
      PGHOST: postgres
      PGPORT: 5432
    # A folder of the host, outside every Docker volume: `make clean` and
    # `make fclean` never delete it, and it can be copied off the machine.
    volumes:
      - ${BACKUP_DIR:-../backups}:/backups
    networks:
      - transcendence
    restart: unless-stopped

networks:
  transcendence:
    external: true
