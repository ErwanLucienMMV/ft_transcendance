<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Transcendance production deployment</title>
  <desc id="desc">Browser reaches Angular, API, WebSockets and Grafana through Nginx. NestJS uses PostgreSQL, the rules engine, bot and mail services. Prometheus scrapes NestJS. An independent backup project connects to PostgreSQL and stores hourly dumps separately.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <style>
      text { font-family: sans-serif; fill: #0f172a; font-size: 16px; }
      .label { font-size: 13px; }
      .node { fill: #fff; stroke: #475569; stroke-width: 1.5; rx: 8; }
      .edge { fill: none; stroke: #475569; stroke-width: 1.5; marker-end: url(#arrow); }
      .storage { fill: #e0f2fe; stroke: #0369a1; stroke-width: 1.5; rx: 8; }
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="30" y="35" font-weight="bold" font-size="23">ft_transcendance · production</text>
  <text x="30" y="60" class="label">SCRUM-522 · dev_test 062aaa6 · 2 November 2026</text>
  <rect x="25" y="170" width="860" height="490" rx="14" fill="#eef2ff" stroke="#6366f1"/>
  <text x="45" y="198" font-weight="bold">Main Compose project · transcendence network</text>
  <rect x="350" y="85" width="240" height="55" class="node"/>
  <text x="370" y="118">Browser / Angular</text>
  <rect x="350" y="230" width="240" height="65" class="node"/>
  <text x="370" y="258">Nginx</text><text x="370" y="280" class="label">TLS + Angular static files</text>
  <rect x="350" y="365" width="240" height="65" class="node"/>
  <text x="370" y="392">NestJS</text><text x="370" y="416" class="label">API + authenticated WebSockets</text>
  <rect x="60" y="365" width="180" height="65" class="node"/>
  <text x="80" y="392">Grafana</text><text x="80" y="416" class="label">/grafana/ via Nginx</text>
  <rect x="60" y="490" width="180" height="55" class="node"/>
  <text x="80" y="522">Prometheus</text>
  <rect x="680" y="365" width="180" height="65" class="node"/>
  <text x="697" y="392">forgemail</text><text x="697" y="416" class="label">internal HTTP 3002</text>
  <rect x="305" y="490" width="170" height="65" class="node"/>
  <text x="322" y="517">Chess rules C++</text><text x="322" y="540" class="label">WebSocket 8081</text>
  <rect x="530" y="490" width="150" height="65" class="node"/>
  <text x="550" y="517">Bot C++</text><text x="550" y="540" class="label">WebSocket 8082</text>
  <rect x="700" y="490" width="160" height="65" class="node"/>
  <text x="720" y="517">PostgreSQL</text><text x="720" y="540" class="label">internal 5432</text>
  <rect x="60" y="590" width="180" height="45" class="storage"/><text x="73" y="618" class="label">metrics + dashboard volumes</text>
  <rect x="690" y="590" width="180" height="45" class="storage"/><text x="720" y="618">postgres_data</text>
  <rect x="930" y="85" width="240" height="55" class="node"/><text x="950" y="118">Google / GitHub</text>
  <rect x="930" y="250" width="240" height="55" class="node"/><text x="950" y="283">SMTP server</text>
  <rect x="910" y="460" width="270" height="200" rx="14" fill="#ecfdf5" stroke="#059669"/>
  <text x="925" y="486" font-weight="bold">Independent backup project</text>
  <rect x="930" y="510" width="230" height="55" class="node"/><text x="945" y="535">Hourly pg_dump</text><text x="945" y="553" class="label">manual restore · 24h retention</text>
  <rect x="930" y="590" width="230" height="45" class="storage"/><text x="941" y="618" class="label">transcendence_backup_data</text>
  <path d="M470 140 V230" class="edge"/><text x="485" y="160" class="label">HTTPS APPPORT</text>
  <path d="M470 295 V365" class="edge"/><text x="480" y="332" class="label">/api/ + /ws</text>
  <path d="M350 265 H150 V365" class="edge"/>
  <path d="M150 430 V490" class="edge"/><text x="160" y="467" class="label">query</text>
  <path d="M240 515 H270 V397 H350" class="edge"/><text x="278" y="454" class="label">scrape</text>
  <path d="M150 545 V590" class="edge"/>
  <path d="M400 430 V490" class="edge"/>
  <path d="M550 430 V460 H605 V490" class="edge"/>
  <path d="M590 410 H650 V470 H780 V490" class="edge"/>
  <path d="M780 555 V590" class="edge"/>
  <path d="M590 390 H680" class="edge"/>
  <path d="M770 365 V278 H930" class="edge"/>
  <path d="M590 112 H930" class="edge"/><text x="680" y="102" class="label">OAuth browser redirects</text>
  <path d="M590 375 H895 V155 H1050 V140" class="edge"/><text x="905" y="335" class="label">server-side OAuth</text>
  <path d="M930 538 H860" class="edge"/>
  <path d="M1045 565 V590" class="edge"/>
  <text x="30" y="705">Also published by current production Compose: PostgreSQL DATABASE_PORT and Prometheus 9090.</text>
  <text x="30" y="735">Development uses Angular's proxy on 4200 in place of Nginx; this view shows production.</text>
  <text x="30" y="765">Live database and backup storage have separate lifecycles. Restore is a manual database operation.</text>
</svg>
