name: CI

on:
  push:
    branches:
      - main
      - dev_test
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - dev_test

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            srcs/nestJS/42chess/package-lock.json
            srcs/angular/42chess/package-lock.json

      - name: Backend lint and formatting
        working-directory: srcs/nestJS/42chess
        run: |
          npm ci
          npm run lint
          npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Frontend formatting
        working-directory: srcs/angular/42chess
        run: |
          npm ci
          npx prettier --check "src/**/*.{ts,html,css}" "e2e/**/*.ts"

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          cp srcs/.env.ci srcs/.env
          docker compose -f srcs/docker-compose.yml config -q
          docker compose -f srcs/docker-compose.dev.yml config -q

      - name: Build Docker images
        run: docker compose -f srcs/docker-compose.yml build

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Backend unit, PostgreSQL and HTTP tests (including puzzles), run inside Docker.
      - name: Backend tests
        run: make test

  docker:
    name: Docker startup
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        run: cp srcs/.env.ci srcs/.env

      - name: Start services
        run: docker compose -f srcs/docker-compose.yml up -d

      - name: Show service status
        run: docker compose -f srcs/docker-compose.yml ps

      - name: Verify API health and applied migrations
        run: docker compose -f srcs/docker-compose.yml exec -T nestjs node dist/database/run-readiness-check.js

      - name: Verify that only nginx is published
        run: |
          published=$(docker compose -f srcs/docker-compose.yml ps --format '{{.Service}} {{.Publishers}}' | grep -v '^nginx ' | grep -E '0\.0\.0\.0|\[::\]' || true)
          if [ -n "$published" ]; then
            echo "Unexpected published ports:"; echo "$published"; exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose -f srcs/docker-compose.yml logs

      - name: Stop services
        if: always()
        run: docker compose -f srcs/docker-compose.yml down -v
